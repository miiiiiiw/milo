# 每次 push 就自動重建 manifest.json —— 你只要把 HTML 丟進 repo 就好。
name: Build manifest

on:
  push:
    branches: [main]
    paths: ["**.html", "**.htm", "folders.json", "scripts/build-manifest.mjs"]
  workflow_dispatch:

permissions:
  contents: write

# 連續合併多個 PR 時排隊執行，避免互相搶推送
concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整 git 歷史來取得每個檔案的加入日期
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # main 在建置期間被更新時（例如連續合併兩個 PR），推送會被拒絕：同步到最新 main 後重建再推，最多三次
          for i in 1 2 3; do
            node scripts/build-manifest.mjs
            if git diff --quiet -- manifest.json && [ -z "$(git ls-files --others -- manifest.json)" ]; then
              echo "manifest 沒有變動"; exit 0
            fi
            git add manifest.json
            git commit -q -m "chore: update manifest [skip ci]"
            if git push -q; then exit 0; fi
            echo "::notice::main 已有新的提交，同步後重試（第 $i 次）"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "::error::重試三次仍無法推送 manifest"; exit 1
